[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csds412-pd-progress"
version = "0.1.0"
description = "Baseline scaffolding for Parkinson's progression prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.1,<2.3",
  "scipy>=1.11,<1.14",
  "scikit-learn>=1.4,<1.6",
  "joblib>=1.3,<2.0",
  "matplotlib>=3.8,<4.0",
  "xgboost>=2.0,<2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
